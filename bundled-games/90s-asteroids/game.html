<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTEROIDS - 90s Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            background: radial-gradient(ellipse at center, #0a0f2c 0%, #02030a 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #e9f7ff;
        }
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        canvas#gameCanvas {
            border: 2px solid #4dd0ff;
            background: #02030a;
            display: block;
            box-shadow: 0 0 40px rgba(77, 208, 255, 0.35), inset 0 0 30px rgba(77,208,255,0.08);
            border-radius: 4px;
        }
        .info { color: #e9f7ff; min-width: 240px; }
        .stat-box {
            background: rgba(77, 208, 255, 0.08);
            border: 1px solid #4dd0ff;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .stat-label { font-size: 12px; margin-bottom: 4px; color: #ffd166; letter-spacing: 1px; }
        .stat-value { font-size: 26px; font-weight: bold; color: #e9f7ff; }
        button {
            width: 100%;
            padding: 10px;
            background: #4dd0ff;
            color: #02030a;
            border: 1px solid #4dd0ff;
            font-weight: bold;
            cursor: pointer;
            margin: 4px 0;
            font-family: inherit;
            font-size: 12px;
            border-radius: 3px;
        }
        button:hover { background: #ffd166; border-color: #ffd166; }
        .controls {
            background: rgba(77, 208, 255, 0.06);
            border: 1px solid #4dd0ff;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.6;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="600" height="500"></canvas>
        <div class="info">
            <div class="stat-box"><div class="stat-label">SCORE</div><div class="stat-value" id="score">0</div></div>
            <div class="stat-box"><div class="stat-label">HIGH SCORE</div><div class="stat-value" id="highScore">0</div></div>
            <div class="stat-box"><div class="stat-label">LEVEL</div><div class="stat-value" id="level">1</div></div>
            <div class="stat-box"><div class="stat-label">LIVES</div><div class="stat-value" id="lives">3</div></div>
            <div class="stat-box"><div class="stat-label">ASTEROIDS</div><div class="stat-value" id="asteroids">5</div></div>
            <div class="controls">
                <strong>CONTROLS</strong><br/>
                Arrow Keys - Rotate / Thrust<br/>
                SPACE - Fire<br/>
                H - Hyperspace<br/>
                M - Mute&nbsp;&nbsp;ENTER - Restart
            </div>
            <button onclick="game.start()">START</button>
            <button onclick="game.restart()">RESTART</button>
            <button onclick="location.href='../'">BACK</button>
        </div>
    </div>

    <script>
        const PAL = {
            bg1: '#02030a', bg2: '#0a0f2c',
            cyan: '#4dd0ff', gold: '#ffd166',
            magenta: '#ff5d8f', white: '#e9f7ff'
        };

        const audio = {
            ctx: null,
            muted: localStorage.getItem('asteroids-muted') === '1',
            ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } },
            beep(freq, dur, type, vol) {
                if (this.muted) return;
                this.ensure(); if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = type || 'square';
                o.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(t); o.stop(t + dur + 0.02);
            },
            fire()   { this.beep(880, 0.08, 'square', 0.08); },
            boom()   { this.beep(120, 0.25, 'sawtooth', 0.18); this.beep(60, 0.3, 'square', 0.12); },
            hit()    { this.beep(200, 0.4, 'sawtooth', 0.18); },
            warp()   { this.beep(440, 0.15, 'triangle', 0.12); this.beep(660, 0.15, 'triangle', 0.1); },
            thrust() { this.beep(80 + Math.random()*20, 0.05, 'sawtooth', 0.05); },
            toggleMute() { this.muted = !this.muted; localStorage.setItem('asteroids-muted', this.muted ? '1' : '0'); }
        };

        const game = {
            canvas: document.getElementById('gameCanvas'),
            ctx: null,
            width: 600, height: 500,
            ship: null,
            asteroids: [], bullets: [], particles: [], popups: [], stars: [],
            score: 0,
            highScore: parseInt(localStorage.getItem('asteroids-highscore') || '0', 10),
            level: 1, lives: 3,
            gameRunning: false, gameOver: false,
            screen: 'title', screenAlpha: 0,
            invincible: 0,
            shakeAmount: 0, shakeDuration: 0, shakeX: 0, shakeY: 0,
            difficulty: localStorage.getItem('asteroids-difficulty') || 'medium',
            diffIndex: 1,

            init() {
                this.ctx = this.canvas.getContext('2d');
                this.diffIndex = ['easy','medium','hard'].indexOf(this.difficulty);
                if (this.diffIndex < 0) { this.diffIndex = 1; this.difficulty = 'medium'; }
                this.ship = { x: this.width/2, y: this.height/2, angle: 0, vx: 0, vy: 0, radius: 10, thrusting: false };
                this.makeStars();
                this.setupInput();
                this.spawnLevel();
                this.gameLoop();
            },

            makeStars() {
                this.stars = [];
                for (let i = 0; i < 80; i++) {
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        r: Math.random() * 1.4 + 0.3,
                        tw: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.04 + 0.01
                    });
                }
            },

            diffMod() { return [0.7, 1.0, 1.4][this.diffIndex]; },

            spawnLevel() {
                this.asteroids = [];
                const count = 3 + this.level;
                const speedMul = this.diffMod();
                for (let i = 0; i < count; i++) {
                    let x, y;
                    do {
                        x = Math.random() * this.width;
                        y = Math.random() * this.height;
                    } while (Math.hypot(x - this.ship.x, y - this.ship.y) < 150);
                    this.asteroids.push(this.makeAsteroid(x, y, 40, speedMul));
                }
            },

            makeAsteroid(x, y, radius, speedMul) {
                const verts = 8 + Math.floor(Math.random() * 4);
                const offsets = [];
                for (let i = 0; i < verts; i++) offsets.push(0.75 + Math.random() * 0.4);
                return {
                    x, y,
                    vx: (Math.random() - 0.5) * 3 * (speedMul || 1),
                    vy: (Math.random() - 0.5) * 3 * (speedMul || 1),
                    radius,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.06,
                    offsets
                };
            },

            start() {
                if (this.screen === 'title') {
                    audio.ensure();
                    this.screen = 'playing';
                    this.gameRunning = true;
                    this.screenAlpha = 0;
                }
            },

            shake(amount, dur) {
                this.shakeAmount = Math.max(this.shakeAmount, amount);
                this.shakeDuration = Math.max(this.shakeDuration, dur);
            },

            addPopup(x, y, text, color) {
                this.popups.push({ x, y, text, color: color || PAL.gold, life: 50, max: 50, vy: -0.8 });
            },

            update() {
                for (const s of this.stars) s.tw += s.speed;
                if (this.shakeDuration > 0) {
                    this.shakeDuration--;
                    const decay = Math.exp(-0.05 * (30 - this.shakeDuration));
                    this.shakeX = (Math.random() - 0.5) * this.shakeAmount * decay;
                    this.shakeY = (Math.random() - 0.5) * this.shakeAmount * decay;
                    if (this.shakeDuration <= 0) { this.shakeAmount = 0; this.shakeX = 0; this.shakeY = 0; }
                }
                this.screenAlpha = Math.min(1, this.screenAlpha + 0.04);

                for (let i = this.popups.length - 1; i >= 0; i--) {
                    const p = this.popups[i];
                    p.y += p.vy; p.life--;
                    if (p.life <= 0) this.popups.splice(i, 1);
                }

                if (!this.gameRunning) return;

                if (this.invincible > 0) this.invincible--;

                this.ship.x += this.ship.vx;
                this.ship.y += this.ship.vy;
                this.ship.vx *= 0.99;
                this.ship.vy *= 0.99;

                if (this.ship.x < 0) this.ship.x = this.width;
                if (this.ship.x > this.width) this.ship.x = 0;
                if (this.ship.y < 0) this.ship.y = this.height;
                if (this.ship.y > this.height) this.ship.y = 0;

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.x += b.vx; b.y += b.vy; b.life--;
                    if (b.x < 0 || b.x > this.width || b.y < 0 || b.y > this.height || b.life <= 0) {
                        this.bullets.splice(i, 1);
                    }
                }

                for (let asteroid of this.asteroids) {
                    asteroid.x += asteroid.vx;
                    asteroid.y += asteroid.vy;
                    asteroid.rotation += asteroid.rotationSpeed;
                    if (asteroid.x < 0) asteroid.x = this.width;
                    if (asteroid.x > this.width) asteroid.x = 0;
                    if (asteroid.y < 0) asteroid.y = this.height;
                    if (asteroid.y > this.height) asteroid.y = 0;
                }

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const bullet = this.bullets[i];
                    for (let j = this.asteroids.length - 1; j >= 0; j--) {
                        const ast = this.asteroids[j];
                        if (Math.hypot(bullet.x - ast.x, bullet.y - ast.y) < ast.radius) {
                            const pts = Math.ceil(100 / (ast.radius / 40));
                            this.score += pts;
                            this.bullets.splice(i, 1);
                            this.asteroids.splice(j, 1);
                            this.createParticles(ast.x, ast.y, 14, PAL.gold);
                            this.addPopup(ast.x, ast.y, '+' + pts, PAL.gold);
                            audio.boom();
                            this.shake(3, 12);
                            if (ast.radius > 20) {
                                for (let k = 0; k < 2; k++) {
                                    const a = this.makeAsteroid(ast.x, ast.y, ast.radius / 2, this.diffMod());
                                    a.vx = (Math.random() - 0.5) * 4 * this.diffMod();
                                    a.vy = (Math.random() - 0.5) * 4 * this.diffMod();
                                    this.asteroids.push(a);
                                }
                            }
                            break;
                        }
                    }
                }

                if (this.invincible === 0) {
                    for (let ast of this.asteroids) {
                        if (Math.hypot(this.ship.x - ast.x, this.ship.y - ast.y) < ast.radius + this.ship.radius) {
                            this.lives--;
                            audio.hit();
                            this.shake(10, 28);
                            this.createParticles(this.ship.x, this.ship.y, 30, PAL.magenta);
                            this.invincible = 90;
                            if (this.lives <= 0) {
                                this.gameOver = true;
                                this.gameRunning = false;
                                this.screen = 'gameover';
                                this.screenAlpha = 0;
                                if (this.score > this.highScore) {
                                    this.highScore = this.score;
                                    localStorage.setItem('asteroids-highscore', String(this.highScore));
                                }
                            }
                            this.ship.x = this.width / 2;
                            this.ship.y = this.height / 2;
                            this.ship.vx = 0; this.ship.vy = 0;
                            break;
                        }
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.98; p.vy *= 0.98;
                    p.life--;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
                if (this.particles.length > 200) this.particles.splice(0, this.particles.length - 200);

                if (this.asteroids.length === 0) {
                    this.level++;
                    this.addPopup(this.width/2, this.height/2, 'LEVEL ' + this.level, PAL.cyan);
                    audio.warp();
                    this.shake(4, 14);
                    this.spawnLevel();
                }
            },

            drawBackground() {
                const g = this.ctx.createRadialGradient(this.width/2, this.height/2, 40, this.width/2, this.height/2, this.width*0.7);
                g.addColorStop(0, PAL.bg2);
                g.addColorStop(1, PAL.bg1);
                this.ctx.fillStyle = g;
                this.ctx.fillRect(0, 0, this.width, this.height);
                for (const s of this.stars) {
                    const a = 0.4 + 0.6 * Math.abs(Math.sin(s.tw));
                    this.ctx.globalAlpha = a;
                    this.ctx.fillStyle = PAL.white;
                    this.ctx.fillRect(s.x, s.y, s.r, s.r);
                }
                this.ctx.globalAlpha = 1;
            },

            drawShip(blink) {
                if (blink && Math.floor(this.invincible / 6) % 2 === 0) return;
                this.ctx.save();
                this.ctx.translate(this.ship.x, this.ship.y);
                this.ctx.rotate(this.ship.angle);
                this.ctx.shadowColor = PAL.cyan;
                this.ctx.shadowBlur = 12;
                const grad = this.ctx.createLinearGradient(-10, 0, 12, 0);
                grad.addColorStop(0, '#1a3a6b');
                grad.addColorStop(1, PAL.cyan);
                this.ctx.fillStyle = grad;
                this.ctx.strokeStyle = PAL.white;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.moveTo(12, 0);
                this.ctx.lineTo(-8, -8);
                this.ctx.lineTo(-4, 0);
                this.ctx.lineTo(-8, 8);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                if (this.ship.thrusting && Math.random() > 0.3) {
                    this.ctx.shadowColor = PAL.gold;
                    this.ctx.fillStyle = PAL.gold;
                    this.ctx.beginPath();
                    this.ctx.moveTo(-4, 0);
                    this.ctx.lineTo(-10 - Math.random()*4, -3);
                    this.ctx.lineTo(-14 - Math.random()*4, 0);
                    this.ctx.lineTo(-10 - Math.random()*4, 3);
                    this.ctx.closePath();
                    this.ctx.fill();
                }
                this.ctx.restore();
            },

            drawAsteroid(ast) {
                this.ctx.save();
                this.ctx.translate(ast.x, ast.y);
                this.ctx.rotate(ast.rotation);
                const g = this.ctx.createRadialGradient(-ast.radius*0.3, -ast.radius*0.3, ast.radius*0.1, 0, 0, ast.radius);
                g.addColorStop(0, '#aab8c8');
                g.addColorStop(1, '#3a4a66');
                this.ctx.fillStyle = g;
                this.ctx.strokeStyle = PAL.cyan;
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                const n = ast.offsets.length;
                for (let i = 0; i < n; i++) {
                    const a = (i / n) * Math.PI * 2;
                    const r = ast.radius * ast.offsets[i];
                    const px = Math.cos(a) * r;
                    const py = Math.sin(a) * r;
                    if (i === 0) this.ctx.moveTo(px, py); else this.ctx.lineTo(px, py);
                }
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();
                this.ctx.restore();
            },

            draw() {
                this.ctx.save();
                this.ctx.translate(this.shakeX, this.shakeY);
                this.drawBackground();
                for (let ast of this.asteroids) this.drawAsteroid(ast);

                this.ctx.save();
                this.ctx.shadowColor = PAL.gold;
                this.ctx.shadowBlur = 10;
                this.ctx.fillStyle = PAL.gold;
                for (let b of this.bullets) {
                    this.ctx.beginPath();
                    this.ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.restore();

                for (let p of this.particles) {
                    this.ctx.globalAlpha = Math.max(0, p.life / p.max);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                }
                this.ctx.globalAlpha = 1;

                if (this.screen === 'playing') this.drawShip(this.invincible > 0);

                for (const pp of this.popups) {
                    this.ctx.globalAlpha = pp.life / pp.max;
                    this.ctx.font = 'bold 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                    this.ctx.textAlign = 'center';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeStyle = '#000';
                    this.ctx.strokeText(pp.text, pp.x, pp.y);
                    this.ctx.fillStyle = pp.color;
                    this.ctx.fillText(pp.text, pp.x, pp.y);
                }
                this.ctx.globalAlpha = 1;
                this.ctx.textAlign = 'left';

                this.ctx.font = 'bold 24px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = '#000';
                this.ctx.strokeText('SCORE ' + this.score, 12, 30);
                this.ctx.fillStyle = PAL.white;
                this.ctx.fillText('SCORE ' + this.score, 12, 30);
                this.ctx.font = 'bold 18px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.strokeText('HI ' + this.highScore, 12, 52);
                this.ctx.fillStyle = PAL.gold;
                this.ctx.fillText('HI ' + this.highScore, 12, 52);
                for (let i = 0; i < this.lives; i++) {
                    this.ctx.save();
                    this.ctx.translate(this.width - 20 - i * 22, 24);
                    this.ctx.rotate(-Math.PI/2);
                    this.ctx.fillStyle = PAL.cyan;
                    this.ctx.beginPath();
                    this.ctx.moveTo(8, 0);
                    this.ctx.lineTo(-6, -6);
                    this.ctx.lineTo(-3, 0);
                    this.ctx.lineTo(-6, 6);
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.restore();
                }
                if (audio.muted) {
                    this.ctx.fillStyle = PAL.magenta;
                    this.ctx.font = 'bold 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                    this.ctx.fillText('MUTED', this.width - 70, 50);
                }

                if (this.screen === 'title') this.drawTitle();
                if (this.screen === 'gameover') this.drawGameOver();

                this.ctx.restore();

                document.getElementById('score').textContent = this.score;
                document.getElementById('highScore').textContent = this.highScore;
                document.getElementById('level').textContent = this.level;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('asteroids').textContent = this.asteroids.length;
            },

            drawTitle() {
                this.ctx.globalAlpha = this.screenAlpha;
                this.ctx.fillStyle = 'rgba(2,3,10,0.78)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = PAL.cyan;
                this.ctx.font = 'bold 56px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.shadowColor = PAL.cyan;
                this.ctx.shadowBlur = 20;
                this.ctx.fillText('ASTEROIDS', this.width / 2, 130);
                this.ctx.shadowBlur = 0;
                this.ctx.font = 'bold 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.fillStyle = PAL.white;
                this.ctx.fillText('DIFFICULTY: ' + this.difficulty.toUpperCase(), this.width / 2, 210);
                this.ctx.font = '14px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.fillStyle = PAL.gold;
                this.ctx.fillText('Press 1 = Easy   2 = Medium   3 = Hard', this.width / 2, 235);
                this.ctx.font = '14px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.fillStyle = PAL.white;
                const lines = [
                    'Arrow Keys to rotate and thrust',
                    'SPACE to fire   H for hyperspace',
                    'M to mute audio',
                    '',
                    'Press ENTER or SPACE to launch'
                ];
                lines.forEach((l, i) => this.ctx.fillText(l, this.width/2, 290 + i * 22));
                this.ctx.textAlign = 'left';
                this.ctx.globalAlpha = 1;
            },

            drawGameOver() {
                this.ctx.globalAlpha = this.screenAlpha;
                this.ctx.fillStyle = 'rgba(2,3,10,0.85)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = PAL.magenta;
                this.ctx.font = 'bold 48px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.shadowColor = PAL.magenta;
                this.ctx.shadowBlur = 20;
                this.ctx.fillText('GAME OVER', this.width/2, this.height/2 - 50);
                this.ctx.shadowBlur = 0;
                this.ctx.font = 'bold 22px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.fillStyle = PAL.white;
                this.ctx.fillText('Final Score: ' + this.score, this.width/2, this.height/2);
                this.ctx.fillStyle = PAL.gold;
                this.ctx.fillText('High Score: ' + this.highScore, this.width/2, this.height/2 + 30);
                this.ctx.font = '14px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
                this.ctx.fillStyle = PAL.cyan;
                this.ctx.fillText('Press ENTER to restart', this.width/2, this.height/2 + 80);
                this.ctx.textAlign = 'left';
                this.ctx.globalAlpha = 1;
            },

            createParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 24, max: 24,
                        color: color || PAL.gold,
                        size: 2 + Math.random() * 2
                    });
                }
                if (this.particles.length > 200) this.particles.splice(0, this.particles.length - 200);
            },

            setDifficulty(idx) {
                this.diffIndex = idx;
                this.difficulty = ['easy','medium','hard'][idx];
                localStorage.setItem('asteroids-difficulty', this.difficulty);
            },

            setupInput() {
                const keys = {};
                document.addEventListener('keydown', (e) => {
                    keys[e.key.toLowerCase()] = true;
                    if (this.screen === 'title') {
                        if (e.key === '1') this.setDifficulty(0);
                        if (e.key === '2') this.setDifficulty(1);
                        if (e.key === '3') this.setDifficulty(2);
                        if (e.key === 'Enter' || e.key === ' ') { this.start(); e.preventDefault(); return; }
                    }
                    if (this.screen === 'gameover' && e.key === 'Enter') { this.restart(); return; }
                    if (this.screen === 'playing') {
                        if (e.key === ' ') {
                            this.bullets.push({
                                x: this.ship.x + 12 * Math.cos(this.ship.angle),
                                y: this.ship.y + 12 * Math.sin(this.ship.angle),
                                vx: 6 * Math.cos(this.ship.angle) + this.ship.vx,
                                vy: 6 * Math.sin(this.ship.angle) + this.ship.vy,
                                life: 70
                            });
                            audio.fire();
                            e.preventDefault();
                        }
                        if (e.key.toLowerCase() === 'h') {
                            this.ship.x = Math.random() * this.width;
                            this.ship.y = Math.random() * this.height;
                            audio.warp();
                            this.createParticles(this.ship.x, this.ship.y, 16, PAL.cyan);
                        }
                    }
                    if (e.key.toLowerCase() === 'm') audio.toggleMute();
                });
                document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

                setInterval(() => {
                    if (this.screen !== 'playing') { this.ship.thrusting = false; return; }
                    if (keys['arrowleft']) this.ship.angle -= 0.1;
                    if (keys['arrowright']) this.ship.angle += 0.1;
                    if (keys['arrowup']) {
                        this.ship.vx += 0.5 * Math.cos(this.ship.angle);
                        this.ship.vy += 0.5 * Math.sin(this.ship.angle);
                        this.ship.thrusting = true;
                        if (Math.random() < 0.4) audio.thrust();
                    } else {
                        this.ship.thrusting = false;
                    }
                }, 20);
            },

            restart() {
                this.asteroids = [];
                this.bullets = [];
                this.particles = [];
                this.popups = [];
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.gameRunning = false;
                this.gameOver = false;
                this.ship.x = this.width / 2;
                this.ship.y = this.height / 2;
                this.ship.vx = 0;
                this.ship.vy = 0;
                this.ship.angle = 0;
                this.invincible = 0;
                this.screen = 'title';
                this.screenAlpha = 0;
                this.spawnLevel();
                this.draw();
            },

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        };

        game.init();
    </script>
</body>
</html>
