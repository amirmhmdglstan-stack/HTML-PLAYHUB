<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullet Hell - Action Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --c1: #ffffff;
            --c2: #00fff7;
            --c3: #ff00ea;
            --c4: #ffea00;
            --c5: #050018;
        }
        html, body { height: 100%; }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            color: var(--c2);
            overflow: hidden;
            background: var(--c5);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,0,234,0.18), transparent 55%),
                radial-gradient(circle at 80% 70%, rgba(0,255,247,0.18), transparent 55%),
                linear-gradient(180deg, #050018 0%, #10003a 50%, #2b005a 100%);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,255,247,0.05) 0 1px, transparent 1px 4px);
            pointer-events: none;
            animation: scan 6s linear infinite;
        }
        @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 24px; } }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 1;
            position: relative;
        }

        .header {
            text-align: center;
            text-shadow: 0 0 20px var(--c2);
            border: 3px solid var(--c2);
            padding: 10px 30px;
            background: rgba(0, 255, 247, 0.08);
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,255,247,0.3), inset 0 0 18px rgba(255,0,234,0.18);
            letter-spacing: 6px;
        }
        .header h1 { font-size: 2em; }

        .stats {
            display: flex;
            gap: 22px;
            justify-content: center;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .stat {
            border: 2px solid var(--c2);
            padding: 8px 14px;
            background: rgba(0, 255, 247, 0.05);
            border-radius: 4px;
            min-width: 110px;
            text-align: center;
        }
        .stat span { color: var(--c4); text-shadow: 0 0 6px var(--c4); }

        .instruction {
            text-align: center;
            color: var(--c2);
            font-size: 0.95em;
            letter-spacing: 1px;
        }

        .stage { position: relative; }
        #canvas {
            border: 3px solid var(--c2);
            background: #000;
            box-shadow: 0 0 30px rgba(0,255,247,0.5), inset 0 0 30px rgba(255,0,234,0.2);
            border-radius: 4px;
            display: block;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--c1);
            background: rgba(5, 0, 24, 0.82);
            border-radius: 4px;
            font-size: 22px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-align: center;
            padding: 20px;
        }
        .overlay.show { opacity: 1; }
        .overlay .big { font-size: 36px; margin-bottom: 8px; letter-spacing: 4px; text-shadow: 0 0 16px var(--c3); }
        .overlay .small { font-size: 14px; opacity: 0.9; letter-spacing: 1px; }

        .message {
            min-height: 24px;
            font-size: 1.1em;
            text-shadow: 0 0 10px currentColor;
            letter-spacing: 1px;
        }
        .message.success { color: #00ff90; }
        .message.error { color: #ff4477; }

        .controls { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        button, select {
            padding: 10px 22px;
            font-size: 1em;
            background: linear-gradient(135deg, var(--c2), var(--c3));
            color: var(--c5);
            border: 2px solid var(--c1);
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 2px;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0,255,247,0.4);
        }
        button:hover { transform: translateY(-1px); }
        button:active { transform: translateY(1px); }

        .diff-row { display: flex; gap: 8px; align-items: center; }
        .diff-row label { color: var(--c2); font-size: 14px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="header">
            <h1>BULLET HELL</h1>
        </div>
        <div class="stats">
            <div class="stat">SCORE <span id="score">0</span></div>
            <div class="stat">LIVES <span id="lives">3</span></div>
            <div class="stat">WAVE <span id="wave">1</span></div>
        </div>
        <div class="instruction">DODGE THE BULLETS &middot; ARROW KEYS or MOUSE &middot; M to mute</div>
        <div class="diff-row">
            <label for="diffSelect">DIFFICULTY</label>
            <select id="diffSelect" onchange="game.setDifficulty(this.value)">
                <option value="easy">EASY</option>
                <option value="medium" selected>MEDIUM</option>
                <option value="hard">HARD</option>
            </select>
        </div>
        <div class="stage">
            <canvas id="canvas" width="800" height="500"></canvas>
            <div class="overlay" id="overlay"></div>
        </div>
        <div class="message" id="message"></div>
        <div class="controls">
            <button onclick="game.reset()">NEW GAME</button>
            <button onclick="game.toggleMute()" id="muteBtn">SOUND: ON</button>
            <button onclick="location.href='../'">BACK</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const Sfx = (() => {
            let actx = null, muted = false;
            function ensure() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
            function beep(freq, dur, type, vol) {
                if (muted) return;
                if (!type) type = 'square';
                if (!vol) vol = 0.05;
                const c = ensure(); if (!c) return;
                const o = c.createOscillator(), g = c.createGain();
                o.type = type; o.frequency.value = freq;
                g.gain.value = vol;
                o.connect(g); g.connect(c.destination);
                const t = c.currentTime;
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.start(t); o.stop(t + dur);
            }
            return {
                fire() { beep(360, 0.04, 'square', 0.025); },
                hit() { beep(140, 0.25, 'sawtooth', 0.1); },
                wave() { beep(660, 0.1); setTimeout(()=>beep(880, 0.12, 'sine', 0.08), 100); },
                over() { beep(180, 0.4, 'sawtooth', 0.1); setTimeout(()=>beep(110, 0.5, 'sawtooth', 0.1), 120); },
                star() { beep(1200, 0.05, 'sine', 0.04); },
                toggle() { muted = !muted; return muted; }
            };
        })();

        const DIFFICULTIES = {
            easy:   { baseBullets: 1, shootDelay: 80, lives: 5, enemyMul: 0.7, label: 'EASY' },
            medium: { baseBullets: 1, shootDelay: 60, lives: 3, enemyMul: 1.0, label: 'MEDIUM' },
            hard:   { baseBullets: 2, shootDelay: 45, lives: 3, enemyMul: 1.3, label: 'HARD' }
        };

        // shake / camera follow
        let cameraX = 0, cameraY = 0, targetCamX = 0, targetCamY = 0;
        let shake = 0;

        // particles & popups
        const particles = [];
        const popups = [];
        const PARTICLE_CAP = 200;

        function spawnBurst(x, y, color, count) {
            for (let i = 0; i < count && particles.length < PARTICLE_CAP; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s,
                    life: 20 + Math.random() * 18,
                    max: 38,
                    color,
                    size: 2 + Math.random() * 2.5
                });
            }
        }

        // background star field
        const stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                z: Math.random(),
                col: ['#00fff7', '#ff00ea', '#ffea00', '#ffffff'][i % 4]
            });
        }

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 40;
                this.width = 30;
                this.height = 30;
                this.speed = 5;
                this.vx = 0;
                this.vy = 0;
                this.flash = 0;
            }

            update(keys) {
                if (keys['ArrowLeft']) this.vx = -this.speed;
                if (keys['ArrowRight']) this.vx = this.speed;
                if (keys['ArrowUp']) this.vy = -this.speed;
                if (keys['ArrowDown']) this.vy = this.speed;

                if (!keys['ArrowLeft'] && !keys['ArrowRight']) this.vx *= 0.9;
                if (!keys['ArrowUp'] && !keys['ArrowDown']) this.vy *= 0.9;

                this.x += this.vx;
                this.y += this.vy;

                this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));
                this.y = Math.max(this.height / 2, Math.min(canvas.height - this.height / 2, this.y));

                if (this.flash > 0) this.flash--;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowColor = this.flash > 0 ? '#ffea00' : '#00ff90';
                ctx.shadowBlur = 18;
                const g = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.width / 2);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.5, '#00ff90');
                g.addColorStop(1, '#007a44');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffea00';
                ctx.lineWidth = 2;
                ctx.stroke();
                // inner core
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            getCollisionRadius() {
                return this.width / 2 - 2; // forgiving hitbox
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 5;
                this.color = color || '#ff4477';
                this.trail = [];
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();
                this.x += this.vx;
                this.y += this.vy;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 14;
                // trail
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    ctx.globalAlpha = (i / this.trail.length) * 0.5;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, this.radius * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            isOffScreen() {
                return this.x < -20 || this.x > canvas.width + 20 ||
                       this.y < -20 || this.y > canvas.height + 20;
            }

            collidesWith(player) {
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.radius + player.getCollisionRadius();
            }
        }

        class Enemy {
            constructor(x, y, wave) {
                this.x = x;
                this.y = y;
                this.wave = wave;
                this.shootTimer = Math.random() * 30;
                this.moveTimer = 0;
                this.vx = (Math.random() - 0.5) * 2;
                this.pulse = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx;
                if (this.x < 30 || this.x > canvas.width - 30) {
                    this.vx *= -1;
                }
                this.shootTimer--;
                this.moveTimer++;
                this.pulse += 0.08;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowColor = '#ff00ea';
                ctx.shadowBlur = 14 + Math.sin(this.pulse) * 4;
                const g = ctx.createLinearGradient(this.x - 20, this.y - 20, this.x + 20, this.y + 20);
                g.addColorStop(0, '#ff00ea');
                g.addColorStop(1, '#aa00ff');
                ctx.fillStyle = g;
                ctx.fillRect(this.x - 20, this.y - 20, 40, 40);
                ctx.strokeStyle = '#ffea00';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - 20, this.y - 20, 40, 40);
                // eye
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff0044';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            shouldShoot(delay) {
                return this.shootTimer <= 0;
            }

            resetShootTimer(delay) {
                this.shootTimer = Math.max(delay - this.wave * 3, 18);
            }
        }

        class BulletHell {
            constructor() {
                this.player = new Player();
                this.score = 0;
                this.lives = 3;
                this.wave = 1;
                this.gameActive = true;
                this.bullets = [];
                this.enemies = [];
                this.keys = {};
                this.waveTimer = 0;
                this.waveEnemyCount = 3 + this.wave;
                this.titleAlpha = 1;
                this.overlayShown = false;
                this.difficulty = localStorage.getItem('bullet-hell-difficulty') || 'medium';
                this.applyDifficulty();

                this.init();
                this.setupEventListeners();
            }

            applyDifficulty() {
                const cfg = DIFFICULTIES[this.difficulty];
                this.lives = cfg.lives;
                this.shootDelay = cfg.shootDelay;
                this.baseBullets = cfg.baseBullets;
                this.enemyMul = cfg.enemyMul;
                document.getElementById('diffSelect').value = this.difficulty;
            }

            setDifficulty(d) {
                this.difficulty = d;
                localStorage.setItem('bullet-hell-difficulty', d);
                this.reset();
            }

            toggleMute() {
                const m = Sfx.toggle();
                document.getElementById('muteBtn').textContent = m ? 'SOUND: OFF' : 'SOUND: ON';
            }

            init() {
                this.enemies = [];
                const n = Math.ceil(this.waveEnemyCount * this.enemyMul);
                for (let i = 0; i < n; i++) {
                    const x = 100 + (i % 4) * 150;
                    const y = 40 + Math.floor(i / 4) * 60;
                    this.enemies.push(new Enemy(x, y, this.wave));
                }
            }

            setupEventListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                    if (e.key === 'm' || e.key === 'M') this.toggleMute();
                });
                window.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.player.x = (e.clientX - rect.left) * (canvas.width / rect.width);
                });
            }

            spawnBulletPattern(enemy) {
                const baseCount = this.baseBullets + Math.floor(this.wave / 3);
                const px = this.player.x, py = this.player.y;
                for (let i = 0; i < baseCount; i++) {
                    const spread = (i - (baseCount - 1) / 2) * 0.15;
                    const dx = px - enemy.x, dy = py - enemy.y;
                    const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
                    const ang = Math.atan2(dy, dx) + spread;
                    const speed = 3 + this.wave * 0.2;
                    this.bullets.push(new Bullet(enemy.x, enemy.y, Math.cos(ang) * speed, Math.sin(ang) * speed, '#ff4477'));
                }
            }

            update() {
                if (!this.gameActive) return;

                this.player.update(this.keys);

                // camera follow lerp toward player (visual only, small offset)
                targetCamX = (this.player.x - canvas.width / 2) * 0.04;
                targetCamY = (this.player.y - canvas.height / 2) * 0.04;
                cameraX += (targetCamX - cameraX) * 0.08;
                cameraY += (targetCamY - cameraY) * 0.08;

                this.enemies.forEach(enemy => {
                    enemy.update();
                    if (enemy.shouldShoot(this.shootDelay)) {
                        this.spawnBulletPattern(enemy);
                        Sfx.fire();
                        enemy.resetShootTimer(this.shootDelay);
                    }
                });

                this.bullets = this.bullets.filter(bullet => {
                    bullet.update();
                    if (bullet.collidesWith(this.player)) {
                        this.lives--;
                        this.player.flash = 20;
                        shake = 18;
                        Sfx.hit();
                        spawnBurst(this.player.x, this.player.y, '#ffea00', 24);
                        popups.push({ x: this.player.x, y: this.player.y, text: 'HIT!', life: 36, vy: -1.0, color: '#ff4477' });
                        return false;
                    }
                    return !bullet.isOffScreen();
                });

                this.waveTimer++;
                if (this.waveTimer % 6 === 0) this.score++;
                if (this.waveTimer > 60 * 20) {
                    this.waveTimer = 0;
                    this.nextWave();
                }

                if (this.enemies.length === 0) {
                    this.nextWave();
                }

                if (this.lives <= 0) {
                    this.endGame();
                }

                this.updateUI();
            }

            nextWave() {
                this.wave++;
                this.waveEnemyCount = Math.min(10, 3 + this.wave);
                this.score += 100 * this.wave;
                Sfx.wave();
                shake = 8;
                spawnBurst(canvas.width / 2, 50, '#00fff7', 30);
                popups.push({ x: canvas.width / 2, y: 80, text: 'WAVE ' + this.wave, life: 60, vy: -0.4, color: '#00fff7' });
                document.getElementById('message').textContent = 'WAVE ' + this.wave + '!';
                document.getElementById('message').className = 'message success';
                this.init();
            }

            endGame() {
                this.gameActive = false;
                Sfx.over();
                shake = 24;
                this.showOverlay('GAME OVER', 'Final Score: ' + this.score);
                document.getElementById('message').textContent = 'GAME OVER - SCORE ' + this.score;
                document.getElementById('message').className = 'message error';
                this.saveHighScore();
            }

            saveHighScore() {
                const existing = parseInt(localStorage.getItem('bulletHellHighScore') || '0');
                if (this.score > existing) localStorage.setItem('bulletHellHighScore', this.score);
            }

            showOverlay(big, small) {
                const o = document.getElementById('overlay');
                o.innerHTML = '<div class="big">' + big + '</div><div class="small">' + small + '</div>';
                o.classList.add('show');
            }

            hideOverlay() {
                const o = document.getElementById('overlay');
                o.classList.remove('show');
                o.innerHTML = '';
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = this.lives;
                document.getElementById('wave').textContent = this.wave;
            }

            drawBackground() {
                // dark space
                ctx.fillStyle = '#050018';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // stars parallax
                for (const s of stars) {
                    s.y += 0.4 + s.z * 1.2;
                    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                    ctx.save();
                    ctx.globalAlpha = 0.4 + s.z * 0.6;
                    ctx.fillStyle = s.col;
                    ctx.fillRect(s.x, s.y, 1 + s.z * 2, 1 + s.z * 2);
                    ctx.restore();
                }
                // grid floor
                ctx.save();
                ctx.strokeStyle = 'rgba(255,0,234,0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.width; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawFx() {
                // particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.vx *= 0.94; p.vy *= 0.94;
                    p.life--;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life / p.max);
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                // popups
                for (let i = popups.length - 1; i >= 0; i--) {
                    const p = popups[i];
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) { popups.splice(i, 1); continue; }
                    ctx.save();
                    ctx.globalAlpha = Math.min(1, p.life / 24);
                    ctx.font = 'bold 28px ui-monospace, "SF Mono", Menlo, monospace';
                    ctx.textAlign = 'center';
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#050018';
                    ctx.strokeText(p.text, p.x, p.y);
                    ctx.fillStyle = p.color || '#ffffff';
                    ctx.fillText(p.text, p.x, p.y);
                    ctx.restore();
                }
            }

            draw() {
                // shake decay
                if (shake > 0) {
                    shake *= 0.9;
                    if (shake < 0.2) shake = 0;
                }
                const sx = (Math.random() - 0.5) * shake - cameraX;
                const sy = (Math.random() - 0.5) * shake - cameraY;

                ctx.save();
                ctx.translate(sx, sy);

                this.drawBackground();

                this.enemies.forEach(enemy => enemy.draw(ctx));
                this.bullets.forEach(bullet => bullet.draw(ctx));
                this.player.draw(ctx);

                this.drawFx();

                ctx.restore();

                // HUD-like overlay text fade for title at start
                if (this.titleAlpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = this.titleAlpha;
                    ctx.font = 'bold 36px ui-monospace, "SF Mono", Menlo, monospace';
                    ctx.textAlign = 'center';
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#050018';
                    ctx.strokeText('READY', canvas.width / 2, canvas.height / 2 - 20);
                    ctx.fillStyle = '#00fff7';
                    ctx.fillText('READY', canvas.width / 2, canvas.height / 2 - 20);
                    ctx.font = 'bold 18px ui-monospace, "SF Mono", Menlo, monospace';
                    ctx.fillStyle = '#ffea00';
                    ctx.fillText('ARROW KEYS or MOUSE', canvas.width / 2, canvas.height / 2 + 14);
                    ctx.restore();
                    this.titleAlpha = Math.max(0, this.titleAlpha - 0.012);
                }
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }

            reset() {
                this.applyDifficulty();
                this.player = new Player();
                this.score = 0;
                this.wave = 1;
                this.gameActive = true;
                this.bullets = [];
                this.waveEnemyCount = 3 + this.wave;
                this.titleAlpha = 1;
                particles.length = 0;
                popups.length = 0;
                this.hideOverlay();
                document.getElementById('message').textContent = '';
                this.init();
            }
        }

        const game = new BulletHell();
        game.animate();

        window.addEventListener('beforeunload', () => game.saveHighScore());
    </script>
</body>
</html>
