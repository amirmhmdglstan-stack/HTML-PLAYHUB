<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINESWEEPER - 90s Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --c1: #e6f0ff;
            --c2: #6aa9ff;
            --c3: #2161c4;
            --c4: #103a7a;
            --c5: #06162e;
        }
        html, body { height: 100%; }
        body {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            color: var(--c1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background:
                radial-gradient(circle at 20% 10%, rgba(106,169,255,0.35), transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(33,97,196,0.4), transparent 55%),
                linear-gradient(160deg, #06162e 0%, #0a1f4d 60%, #103a7a 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 10% 30%, rgba(255,255,255,0.06) 1px, transparent 2px),
                radial-gradient(circle at 60% 80%, rgba(255,255,255,0.05) 1px, transparent 2px),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 1px, transparent 2px);
            background-size: 220px 220px, 180px 180px, 260px 260px;
            pointer-events: none;
            animation: stars 22s linear infinite;
        }
        @keyframes stars { 0% { background-position: 0 0, 0 0, 0 0; } 100% { background-position: 220px 220px, -180px 180px, 260px -260px; } }

        .window {
            background: rgba(6, 22, 46, 0.85);
            border: 2px solid var(--c2);
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 0 30px rgba(106,169,255,0.35), inset 0 0 30px rgba(33,97,196,0.15);
            position: relative;
            z-index: 1;
        }
        .title-bar {
            background: linear-gradient(90deg, var(--c4), var(--c3));
            color: var(--c1);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px 6px 0 0;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 1px 0 var(--c5);
        }
        .content { padding: 14px; }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        button, select {
            padding: 8px 14px;
            background: linear-gradient(180deg, var(--c2), var(--c3));
            border: 2px solid var(--c1);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            font-family: inherit;
            color: var(--c5);
            letter-spacing: 1px;
        }
        button:hover { background: linear-gradient(180deg, var(--c1), var(--c2)); }
        button:active { transform: translateY(1px); }

        .display {
            background: var(--c5);
            border: 2px solid var(--c3);
            border-radius: 4px;
            padding: 6px 10px;
            min-width: 76px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
            color: #f8c14e;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            text-shadow: 0 0 8px rgba(248,193,78,0.7);
        }
        .smiley {
            width: 40px;
            height: 40px;
            background: linear-gradient(180deg, var(--c2), var(--c3));
            border: 2px solid var(--c1);
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 var(--c5);
            color: var(--c5);
            font-weight: bold;
        }
        .stage {
            position: relative;
            display: inline-block;
        }
        canvas#field {
            display: block;
            background: var(--c5);
            border-radius: 6px;
            box-shadow: inset 0 0 14px rgba(6,22,46,0.85);
        }
        canvas#fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--c1);
            background: rgba(6, 22, 46, 0.8);
            border-radius: 6px;
            font-size: 22px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            text-align: center;
            padding: 10px;
        }
        .overlay.show { opacity: 1; }
        .overlay .big { font-size: 30px; margin-bottom: 8px; letter-spacing: 2px; text-shadow: 0 0 12px var(--c2); }
        .overlay .small { font-size: 14px; opacity: 0.9; }
        .hint { color: var(--c1); font-size: 13px; opacity: 0.85; margin-top: 8px; text-align: center; letter-spacing: 1px; }
        .footer { margin-top: 12px; text-align: center; }
        #msStatus { text-align: center; font-weight: bold; margin-top: 10px; font-size: 16px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>MINESWEEPER</span>
            <span style="opacity:0.7;">CLEAR ALL</span>
        </div>
        <div class="content">
            <div class="controls">
                <select id="diffSelect" onchange="game.setDifficulty(this.value)">
                    <option value="easy">EASY 8x8</option>
                    <option value="medium" selected>MEDIUM 12x12</option>
                    <option value="hard">HARD 16x16</option>
                </select>
                <div class="display" id="mineCounter">000</div>
                <div class="smiley" id="smiley" onclick="game.reset()">OK</div>
                <div class="display" id="timer">000</div>
            </div>

            <div class="stage" id="stage">
                <canvas id="field" width="288" height="288"></canvas>
                <canvas id="fx" width="288" height="288"></canvas>
                <div class="overlay" id="overlay"></div>
            </div>

            <div class="footer">
                <button onclick="game.reset()">NEW GAME</button>
                <button onclick="game.toggleMute()" id="muteBtn">SOUND: ON</button>
                <button onclick="location.href='../'">BACK</button>
            </div>

            <div id="msStatus"></div>
            <div class="hint">CLICK reveal &middot; RIGHT-CLICK flag &middot; M to mute</div>
        </div>
    </div>

    <script>
        const Sfx = (() => {
            let ctx = null, muted = false;
            function ensure() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ctx; }
            function beep(freq, dur, type, vol) {
                if (muted) return;
                if (!type) type = 'square';
                if (!vol) vol = 0.06;
                const c = ensure(); if (!c) return;
                const o = c.createOscillator(), g = c.createGain();
                o.type = type; o.frequency.value = freq;
                g.gain.value = vol;
                o.connect(g); g.connect(c.destination);
                const t = c.currentTime;
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.start(t); o.stop(t + dur);
            }
            return {
                reveal() { beep(520, 0.04, 'square', 0.04); },
                cascade(d) { beep(440 + d * 25, 0.05, 'triangle', 0.05); },
                flag() { beep(220, 0.07, 'square', 0.05); },
                boom() { beep(120, 0.4, 'sawtooth', 0.12); setTimeout(()=>beep(80, 0.3, 'sawtooth', 0.1), 50); },
                win() { beep(660, 0.12); setTimeout(()=>beep(880, 0.16, 'sine', 0.1), 110); setTimeout(()=>beep(1100, 0.2, 'sine', 0.1), 230); },
                toggle() { muted = !muted; return muted; }
            };
        })();

        const DIFFICULTIES = {
            easy:   { width: 8,  height: 8,  mines: 10 },
            medium: { width: 12, height: 12, mines: 30 },
            hard:   { width: 16, height: 16, mines: 60 }
        };

        const NUMBER_COLORS = ['', '#6aa9ff', '#34d399', '#f87171', '#a78bfa', '#fb923c', '#22d3ee', '#fde047', '#fff8dc'];

        const fieldC = document.getElementById('field');
        const fxC = document.getElementById('fx');
        const fctx = fieldC.getContext('2d');
        const xctx = fxC.getContext('2d');
        let CELL = 24;

        const game = {
            grid: [],
            revealed: [],
            flagged: [],
            revealAnim: [],
            difficulty: localStorage.getItem('minesweeper-difficulty') || 'medium',
            gameRunning: false,
            gameOver: false,
            won: false,
            time: 0,
            timerInterval: null,
            width: 12, height: 12,
            mineCount: 30,
            flaggedCount: 0,
            particles: [],
            popups: [],
            shake: 0,
            shakeX: 0, shakeY: 0,
            cascadeQueue: [],

            init() {
                document.getElementById('diffSelect').value = this.difficulty;
                this.applyDifficulty();
                this.reset();
                this.loop();
                this.bindMouse();
            },

            applyDifficulty() {
                const cfg = DIFFICULTIES[this.difficulty];
                this.width = cfg.width;
                this.height = cfg.height;
                this.mineCount = cfg.mines;
                if (this.difficulty === 'easy') CELL = 36;
                else if (this.difficulty === 'medium') CELL = 30;
                else CELL = 24;
                const w = this.width * CELL;
                const h = this.height * CELL;
                fieldC.width = w; fieldC.height = h;
                fxC.width = w; fxC.height = h;
            },

            setDifficulty(d) {
                this.difficulty = d;
                localStorage.setItem('minesweeper-difficulty', d);
                this.applyDifficulty();
                this.reset();
            },

            toggleMute() {
                const m = Sfx.toggle();
                document.getElementById('muteBtn').textContent = m ? 'SOUND: OFF' : 'SOUND: ON';
            },

            reset() {
                clearInterval(this.timerInterval);
                this.grid = [];
                this.revealed = [];
                this.flagged = [];
                this.revealAnim = [];
                this.particles.length = 0;
                this.popups.length = 0;
                this.cascadeQueue = [];
                this.gameRunning = false;
                this.gameOver = false;
                this.won = false;
                this.time = 0;
                this.flaggedCount = 0;

                for (let y = 0; y < this.height; y++) {
                    this.grid[y] = [];
                    this.revealed[y] = [];
                    this.flagged[y] = [];
                    for (let x = 0; x < this.width; x++) {
                        this.grid[y][x] = 0;
                        this.revealed[y][x] = false;
                        this.flagged[y][x] = false;
                    }
                }

                document.getElementById('mineCounter').textContent = String(this.mineCount).padStart(3, '0');
                document.getElementById('timer').textContent = '000';
                document.getElementById('smiley').textContent = 'OK';
                this.hideOverlay();
                const s = document.getElementById('msStatus');
                if (s) { s.textContent = ''; }
            },

            placeMines(safeX, safeY) {
                let placed = 0;
                while (placed < this.mineCount) {
                    const x = Math.floor(Math.random() * this.width);
                    const y = Math.floor(Math.random() * this.height);
                    if (this.grid[y][x] !== 'M' && !(Math.abs(x - safeX) <= 1 && Math.abs(y - safeY) <= 1)) {
                        this.grid[y][x] = 'M';
                        placed++;
                    }
                }
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        if (this.grid[y][x] !== 'M') {
                            let count = 0;
                            for (let dy = -1; dy <= 1; dy++) {
                                for (let dx = -1; dx <= 1; dx++) {
                                    const ny = y + dy, nx = x + dx;
                                    if (ny >= 0 && ny < this.height && nx >= 0 && nx < this.width && this.grid[ny][nx] === 'M') count++;
                                }
                            }
                            this.grid[y][x] = count;
                        }
                    }
                }
            },

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.time++;
                    document.getElementById('timer').textContent = String(Math.min(999, this.time)).padStart(3, '0');
                }, 1000);
            },

            revealCell(x, y) {
                if (!this.gameRunning) {
                    this.gameRunning = true;
                    this.placeMines(x, y);
                    this.startTimer();
                }
                if (this.revealed[y][x] || this.flagged[y][x] || this.gameOver || this.won) return;

                if (this.grid[y][x] === 'M') {
                    this.gameOver = true;
                    this.revealed[y][x] = true;
                    this.revealAnim.push({ x, y, t: 0 });
                    this.spawnExplosion(x, y);
                    Sfx.boom();
                    this.shake = 14;
                    this.revealAll();
                    clearInterval(this.timerInterval);
                    document.getElementById('smiley').textContent = 'X_X';
                    this.showOverlay('GAME OVER', 'Press NEW GAME');
                    this.showStatus('GAME OVER - HIT MINE', '#ff6b6b');
                    return;
                }

                this.cascadeFrom(x, y);
            },

            cascadeFrom(sx, sy) {
                const seen = new Set();
                const queue = [{ x: sx, y: sy, depth: 0 }];
                seen.add(sx + ',' + sy);
                while (queue.length) {
                    const item = queue.shift();
                    const x = item.x, y = item.y, depth = item.depth;
                    if (this.revealed[y][x] || this.flagged[y][x]) continue;
                    this.cascadeQueue.push({ x, y, depth });
                    if (this.grid[y][x] === 0) {
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nx = x + dx, ny = y + dy;
                                if (nx >= 0 && nx < this.width && ny >= 0 && ny < this.height && !seen.has(nx + ',' + ny)) {
                                    seen.add(nx + ',' + ny);
                                    queue.push({ x: nx, y: ny, depth: depth + 1 });
                                }
                            }
                        }
                    }
                }
            },

            processCascade() {
                if (this.cascadeQueue.length === 0) return;
                const batch = this.cascadeQueue.splice(0, Math.max(1, Math.ceil(this.cascadeQueue.length / 20)));
                let firedSfx = false;
                for (const item of batch) {
                    if (this.revealed[item.y][item.x] || this.flagged[item.y][item.x]) continue;
                    this.revealed[item.y][item.x] = true;
                    this.revealAnim.push({ x: item.x, y: item.y, t: 0 });
                    if (!firedSfx) { Sfx.cascade(Math.min(20, item.depth)); firedSfx = true; }
                    if (this.particles.length < 200) this.spawnReveal(item.x, item.y);
                }
                this.checkWin();
            },

            spawnReveal(gx, gy) {
                const cx = gx * CELL + CELL / 2;
                const cy = gy * CELL + CELL / 2;
                for (let i = 0; i < 3; i++) {
                    if (this.particles.length >= 200) break;
                    this.particles.push({
                        x: cx, y: cy,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2 - 0.5,
                        life: 14 + Math.random() * 10,
                        max: 24,
                        color: '#6aa9ff',
                        size: 1.6 + Math.random()
                    });
                }
            },

            spawnExplosion(gx, gy) {
                const cx = gx * CELL + CELL / 2;
                const cy = gy * CELL + CELL / 2;
                for (let i = 0; i < 60; i++) {
                    if (this.particles.length >= 200) break;
                    const a = Math.random() * Math.PI * 2;
                    const s = 1 + Math.random() * 4;
                    this.particles.push({
                        x: cx, y: cy,
                        vx: Math.cos(a) * s,
                        vy: Math.sin(a) * s,
                        life: 22 + Math.random() * 14,
                        max: 36,
                        color: ['#fde047', '#fb923c', '#ef4444'][i % 3],
                        size: 2 + Math.random() * 2.4
                    });
                }
                this.popups.push({ x: cx, y: cy, text: 'BOOM!', life: 50, vy: -0.5 });
            },

            toggleFlag(x, y) {
                if (this.revealed[y][x] || this.gameOver || this.won) return;
                if (!this.flagged[y][x] && this.flaggedCount < this.mineCount) {
                    this.flagged[y][x] = true;
                    this.flaggedCount++;
                    Sfx.flag();
                } else if (this.flagged[y][x]) {
                    this.flagged[y][x] = false;
                    this.flaggedCount--;
                    Sfx.flag();
                }
                document.getElementById('mineCounter').textContent = String(Math.max(0, this.mineCount - this.flaggedCount)).padStart(3, '0');
            },

            checkWin() {
                let allRevealed = true;
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        if (this.grid[y][x] !== 'M' && !this.revealed[y][x]) allRevealed = false;
                    }
                }
                if (allRevealed && !this.won) {
                    this.won = true;
                    clearInterval(this.timerInterval);
                    document.getElementById('smiley').textContent = 'YES!';
                    this.showOverlay('YOU WIN!', 'Time: ' + this.time + 's');
                    this.showStatus('YOU WON IN ' + this.time + ' SECONDS', '#34d399');
                    Sfx.win();
                    for (let i = 0; i < 80; i++) {
                        if (this.particles.length >= 200) break;
                        this.particles.push({
                            x: Math.random() * fieldC.width,
                            y: -5,
                            vx: (Math.random() - 0.5) * 2,
                            vy: 1 + Math.random() * 3,
                            life: 60 + Math.random() * 40,
                            max: 100,
                            color: ['#fde047', '#6aa9ff', '#34d399', '#a78bfa'][i % 4],
                            size: 2 + Math.random() * 2
                        });
                    }
                }
            },

            showStatus(text, color) {
                const el = document.getElementById('msStatus');
                el.textContent = text;
                el.style.color = color;
            },

            hideOverlay() {
                const o = document.getElementById('overlay');
                o.classList.remove('show');
                o.innerHTML = '';
            },

            showOverlay(big, small) {
                const o = document.getElementById('overlay');
                o.innerHTML = '<div class="big">' + big + '</div><div class="small">' + small + '</div>';
                o.classList.add('show');
            },

            revealAll() {
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        if (!this.revealed[y][x]) {
                            this.revealed[y][x] = true;
                            this.revealAnim.push({ x, y, t: 0 });
                        }
                    }
                }
            },

            roundRect(c, x, y, w, h, r) {
                c.beginPath();
                c.moveTo(x + r, y);
                c.lineTo(x + w - r, y);
                c.quadraticCurveTo(x + w, y, x + w, y + r);
                c.lineTo(x + w, y + h - r);
                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                c.lineTo(x + r, y + h);
                c.quadraticCurveTo(x, y + h, x, y + h - r);
                c.lineTo(x, y + r);
                c.quadraticCurveTo(x, y, x + r, y);
                c.closePath();
            },

            draw() {
                if (this.shake > 0) {
                    this.shakeX = (Math.random() - 0.5) * this.shake;
                    this.shakeY = (Math.random() - 0.5) * this.shake;
                    this.shake *= 0.86;
                    if (this.shake < 0.2) this.shake = 0;
                } else { this.shakeX = this.shakeY = 0; }

                fctx.save();
                fctx.translate(this.shakeX, this.shakeY);

                fctx.fillStyle = '#06162e';
                fctx.fillRect(0, 0, fieldC.width, fieldC.height);

                const animMap = {};
                for (const a of this.revealAnim) animMap[a.x + ',' + a.y] = a;

                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        const px = x * CELL, py = y * CELL;
                        const a = animMap[x + ',' + y];
                        const isMine = this.grid[y][x] === 'M';

                        if (!this.revealed[y][x]) {
                            const g = fctx.createLinearGradient(px, py, px, py + CELL);
                            g.addColorStop(0, '#3b6bb5');
                            g.addColorStop(1, '#103a7a');
                            fctx.fillStyle = g;
                            this.roundRect(fctx, px + 1, py + 1, CELL - 2, CELL - 2, 4);
                            fctx.fill();
                            fctx.strokeStyle = 'rgba(106,169,255,0.5)';
                            fctx.lineWidth = 1;
                            fctx.stroke();

                            if (this.flagged[y][x]) {
                                fctx.save();
                                fctx.shadowColor = '#fde047';
                                fctx.shadowBlur = 8;
                                fctx.fillStyle = '#fde047';
                                fctx.beginPath();
                                fctx.moveTo(px + CELL * 0.35, py + CELL * 0.2);
                                fctx.lineTo(px + CELL * 0.7, py + CELL * 0.35);
                                fctx.lineTo(px + CELL * 0.35, py + CELL * 0.5);
                                fctx.closePath();
                                fctx.fill();
                                fctx.strokeStyle = '#c4862c';
                                fctx.lineWidth = 2;
                                fctx.beginPath();
                                fctx.moveTo(px + CELL * 0.35, py + CELL * 0.2);
                                fctx.lineTo(px + CELL * 0.35, py + CELL * 0.75);
                                fctx.stroke();
                                fctx.restore();
                            }
                        } else {
                            let alpha = 1;
                            let scale = 1;
                            if (a) {
                                a.t = a.t + 1;
                                const p = Math.min(1, a.t / 10);
                                alpha = p;
                                scale = 0.6 + 0.4 * p;
                            }
                            fctx.save();
                            fctx.globalAlpha = alpha;
                            const cx = px + CELL / 2, cy = py + CELL / 2;
                            const sz = CELL * scale;
                            fctx.fillStyle = '#1a3470';
                            this.roundRect(fctx, cx - sz / 2 + 1, cy - sz / 2 + 1, sz - 2, sz - 2, 3);
                            fctx.fill();

                            if (isMine) {
                                fctx.save();
                                fctx.shadowColor = '#ff4444';
                                fctx.shadowBlur = 14;
                                fctx.fillStyle = '#ff4444';
                                fctx.beginPath();
                                fctx.arc(cx, cy, CELL * 0.28 * scale, 0, Math.PI * 2);
                                fctx.fill();
                                fctx.fillStyle = '#fff';
                                fctx.beginPath();
                                fctx.arc(cx - 2, cy - 2, CELL * 0.08 * scale, 0, Math.PI * 2);
                                fctx.fill();
                                fctx.restore();
                            } else if (this.grid[y][x] > 0) {
                                fctx.font = 'bold ' + Math.floor(CELL * 0.55 * scale) + 'px ui-monospace, "SF Mono", Menlo, monospace';
                                fctx.textAlign = 'center';
                                fctx.textBaseline = 'middle';
                                fctx.lineWidth = 3;
                                fctx.strokeStyle = '#06162e';
                                fctx.strokeText(this.grid[y][x], cx, cy);
                                fctx.fillStyle = NUMBER_COLORS[this.grid[y][x]] || '#fff8dc';
                                fctx.fillText(this.grid[y][x], cx, cy);
                            }
                            fctx.restore();
                        }
                    }
                }

                fctx.restore();
            },

            drawFx() {
                xctx.clearRect(0, 0, fxC.width, fxC.height);
                xctx.save();
                xctx.translate(this.shakeX, this.shakeY);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.vy += 0.06;
                    p.life--;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    xctx.globalAlpha = Math.max(0, p.life / p.max);
                    xctx.fillStyle = p.color;
                    xctx.beginPath();
                    xctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    xctx.fill();
                }
                xctx.globalAlpha = 1;

                for (let i = this.popups.length - 1; i >= 0; i--) {
                    const p = this.popups[i];
                    p.y += p.vy;
                    p.vy *= 0.96;
                    p.life--;
                    if (p.life <= 0) { this.popups.splice(i, 1); continue; }
                    xctx.globalAlpha = Math.min(1, p.life / 24);
                    xctx.font = 'bold 22px ui-monospace, "SF Mono", Menlo, monospace';
                    xctx.textAlign = 'center';
                    xctx.lineWidth = 4;
                    xctx.strokeStyle = '#06162e';
                    xctx.strokeText(p.text, p.x, p.y);
                    xctx.fillStyle = '#fde047';
                    xctx.fillText(p.text, p.x, p.y);
                }
                xctx.globalAlpha = 1;
                xctx.restore();
            },

            bindMouse() {
                fieldC.addEventListener('click', (e) => {
                    const r = fieldC.getBoundingClientRect();
                    const x = Math.floor((e.clientX - r.left) * (fieldC.width / r.width) / CELL);
                    const y = Math.floor((e.clientY - r.top) * (fieldC.height / r.height) / CELL);
                    if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                        Sfx.reveal();
                        this.revealCell(x, y);
                    }
                });
                fieldC.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const r = fieldC.getBoundingClientRect();
                    const x = Math.floor((e.clientX - r.left) * (fieldC.width / r.width) / CELL);
                    const y = Math.floor((e.clientY - r.top) * (fieldC.height / r.height) / CELL);
                    if (x >= 0 && x < this.width && y >= 0 && y < this.height) {
                        this.toggleFlag(x, y);
                    }
                });
            },

            loop() {
                this.processCascade();
                this.draw();
                this.drawFx();
                requestAnimationFrame(() => this.loop());
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M') game.toggleMute();
        });

        game.init();
    </script>
</body>
</html>
