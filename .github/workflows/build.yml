name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed for creating GitHub Releases on tags

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test + audit (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node tools/audit-games.mjs
      - run: node tools/smoke-seed.mjs

  build-win:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch bundled games (incl. direct downloads)
        run: node tools/fetch-games.mjs --fresh
      - name: Build catalog
        run: node tools/build-catalog.mjs
      - name: Audit games
        run: node tools/audit-games.mjs
      - name: Build Windows installers
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum HTML* > checksums.txt || shasum -a 256 HTML* > checksums.txt
          cat checksums.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-playhub-windows
          path: |
            release/*.exe
            release/*.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build-win
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-playhub-windows
          path: release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/checksums.txt
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
